name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  servidor-linux:
    name: Servidor Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Publicar servidor linux-x64
        run: dotnet publish MundoVoxel.Server -c Release -r linux-x64 --self-contained -o pub/linux
      - name: Empaquetar tar.gz
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp deploy/linux/mundo-voxel.service deploy/linux/INSTALL.txt pub/linux/
          tar -czf "MundoVoxel-Server-linux-x64-$VER.tar.gz" -C pub/linux .
      - name: Empaquetar .deb
        run: |
          VER="${GITHUB_REF_NAME#v}"
          bash -x deploy/linux/empaquetar-deb.sh pub/linux "$VER" . 2>&1 | tee deb.log
          exit ${PIPESTATUS[0]}
      - name: Errores de empaquetado
        if: failure()
        run: |
          tail -6 deb.log 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: |
            MundoVoxel-Server-linux-x64-*.tar.gz
            MundoVoxel-Server-linux-x64-*.deb

  servidor-windows:
    name: Servidor Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Publicar servidor win-x64
        run: dotnet publish MundoVoxel.Server -c Release -r win-x64 --self-contained -o pub/win
      - name: Empaquetar
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path pub/win/* -DestinationPath "MundoVoxel-Server-win-x64-$ver.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: server-win
          path: MundoVoxel-Server-win-x64-*.zip

  cliente-windows:
    name: Cliente Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Instalar workload MAUI
        run: dotnet workload install maui
      - name: Publicar cliente Windows
        run: |
          $ver = $env:GITHUB_REF_NAME -replace "^v",""
          $extra = @(); if ($ver -match '^\d+\.\d+\.\d+$') { $extra = @("-p:Version=$ver","-p:ApplicationDisplayVersion=$ver.0") }
          dotnet publish MundoVoxel.Client -f net10.0-windows10.0.19041.0 -c Release -o pub/cliente @extra 2>&1 | Tee-Object -FilePath publish.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Errores de publicacion
        if: failure()
        run: |
          Select-String -Path publish.log -Pattern 'error ' | Select-Object -First 10 | ForEach-Object { Write-Output (("::error::") + $_.Line) }
      - name: Subir log de publicacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-publish-cliente
          path: publish.log
      - name: Empaquetar
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          Compress-Archive -Path pub/cliente/* -DestinationPath "MundoVoxel-Cliente-Windows-$ver.zip"
      - name: Preparar el certificado del MSIX
        shell: pwsh
        env:
          MSIX_CERT_B64: ${{ secrets.MSIX_CERT_B64 }}
          MSIX_CERT_PASS: ${{ secrets.MSIX_CERT_PASS }}
        run: |
          # Si hay un certificado propio en secretos se usa ese; si no, uno autofirmado
          # de desarrollo (el MSIX va firmado igual, pero el usuario tiene que confiar en el .cer).
          # El certificado se importa al almacen del usuario y se firma por huella: pasando
          # el .pfx directamente, el empaquetador falla con APPX0105 (no puede importar la clave).
          $pass = "mundovoxel"
          $pfx = Join-Path $env:RUNNER_TEMP "mundovoxel.pfx"
          if ($env:MSIX_CERT_B64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:MSIX_CERT_B64))
            $pass = $env:MSIX_CERT_PASS
            $sec = if ($pass) { ConvertTo-SecureString -String $pass -AsPlainText -Force } else { New-Object System.Security.SecureString }
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
            Write-Output "MSIX: se firma con el certificado de los secretos"
          } else {
            $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=MundoVoxel" -KeyUsage DigitalSignature -FriendlyName "MundoVoxel (desarrollo)" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
            $sec = ConvertTo-SecureString -String $pass -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null
            Export-Certificate -Cert $cert -FilePath "MundoVoxel.cer" | Out-Null
            Write-Output "::warning::MSIX firmado con un certificado autofirmado de desarrollo; se adjunta MundoVoxel.cer para confiar en el"
          }
          "MSIX_THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PFXPASS=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publicar cliente Windows como MSIX
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME -replace "^v",""
          if ($ver -match '^\d+\.\d+\.\d+$') {
            # La version del paquete MSIX la fija el manifiesto, no ApplicationDisplayVersion:
            # sin esto todas las releases compartirian 1.0.0.0 y Windows no actualizaria en sitio.
            $manifiesto = "MundoVoxel.Client/Platforms/Windows/Package.appxmanifest"
            $textoManifiesto = [IO.File]::ReadAllText($manifiesto)
            $textoManifiesto = [Text.RegularExpressions.Regex]::Replace($textoManifiesto, '(?s)(<Identity[^>]*?Version=")[^"]+(")', '${1}' + $ver + '.0${2}')
            [IO.File]::WriteAllText($manifiesto, $textoManifiesto)
            Write-Output "MSIX: version del paquete $ver.0 (tomada del tag)"
          }
          $argumentosMsix = @("publish","MundoVoxel.Client","-f","net10.0-windows10.0.19041.0","-c","Release","-o","pub/msix","-p:WindowsPackageType=MSIX","-p:GenerateAppxPackageOnBuild=true","-p:AppxPackageSigningEnabled=true","-p:PackageCertificateThumbprint=$env:MSIX_THUMB")
          if ($ver -match '^\d+\.\d+\.\d+$') { $argumentosMsix += "-p:ApplicationDisplayVersion=$ver.0" }
          & dotnet @argumentosMsix 2>&1 | Tee-Object -FilePath msix.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $pkg = Get-ChildItem -Path pub/msix, MundoVoxel.Client/bin/Release -Recurse -Filter *.msix -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pkg) { throw "No se genero el MSIX" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try { $firmado = ($z.Entries | Where-Object { $_.FullName -eq "AppxSignature.p7x" }).Count -gt 0 } finally { $z.Dispose() }
          if (-not $firmado) { throw "El MSIX no lleva firma (falta AppxSignature.p7x)" }
          Copy-Item $pkg.FullName "MundoVoxel-$ver.msix"
          Write-Output "MSIX: $($pkg.Name)"
      - name: Errores del MSIX
        if: failure()
        shell: pwsh
        run: |
          Select-String -Path msix.log -Pattern "error" | Select-Object -First 10 | ForEach-Object { Write-Output (("::error::") + $_.Line) }
      - uses: actions/upload-artifact@v4
        with:
          name: cliente-windows
          path: |
            MundoVoxel-Cliente-Windows-*.zip
            MundoVoxel-*.msix
            MundoVoxel.cer

  apk-android:
    name: APK Android
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - name: Instalar workload MAUI
        run: dotnet workload install maui
      - name: Publicar APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          # Sin el keystore en secretos se firma con la clave de depuracion de siempre;
          # con el, el APK de release va firmado con la clave propia.
          $args = @("publish","MundoVoxel.Client","-f","net10.0-android","-c","Release","-o","pub/apk")
          $verApk = $env:GITHUB_REF_NAME -replace '^v',''
          if ($verApk -match '^(\d+)\.(\d+)\.(\d+)$') {
            # El versionCode tiene que subir en cada release o Android no deja actualizar en sitio.
            $codigoApk = [int]$Matches[1] * 10000 + [int]$Matches[2] * 100 + [int]$Matches[3]
            $args += @("-p:ApplicationDisplayVersion=$verApk", "-p:ApplicationVersion=$codigoApk")
            Write-Output "APK: version $verApk (codigo $codigoApk)"
          }
          if ($env:ANDROID_KEYSTORE_B64) {
            $ks = Join-Path $env:RUNNER_TEMP "release.keystore"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_B64))
            $args += @("-p:AndroidKeyStore=true","-p:AndroidSigningKeyStore=$ks",
                       "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASS",
                       "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS",
                       "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASS")
            Write-Output "APK: se firma con el keystore de release"
          } else {
            Write-Output "::warning::Sin ANDROID_KEYSTORE_B64: el APK se firma con la clave de depuracion"
          }
          dotnet @args 2>&1 | Tee-Object -FilePath publish.apk.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Empaquetar
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $apk = Get-ChildItem -Path pub/apk -Recurse -Filter *.apk | Where-Object { $_.Name -like '*Signed*' } | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Path pub/apk -Recurse -Filter *.apk | Select-Object -First 1 }
          if (-not $apk) { throw 'No se genero ningun APK' }
          Copy-Item $apk.FullName "MundoVoxel-$ver.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: MundoVoxel-*.apk

  release:
    name: Publicar release
    needs: [servidor-linux, servidor-windows, cliente-windows, apk-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extraer la seccion del changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v pat="## [$VER]" 'index($0, pat) == 1 { f = 1; print; next } f && index($0, "## ") == 1 { exit } f { print }' changelog.md > notas.md
          if [ ! -s notas.md ]; then echo "MundoVoxel $GITHUB_REF_NAME" > notas.md; fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Reunir los binarios
        run: |
          mkdir -p release
          find artifacts -type f ! -name 'publish.log' -exec mv {} release/ \;
          ls -la release
      - name: Crear el release
        uses: softprops/action-gh-release@v2
        with:
          name: MundoVoxel ${{ github.ref_name }}
          body_path: notas.md
          files: release/*
          fail_on_unmatched_files: true
