name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  servidor-y-suite:
    name: Servidor y suite de pruebas (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar Core y Server
        run: |
          dotnet build MundoVoxel.Core -c Release
          dotnet build MundoVoxel.Server -c Release

      - name: Ejecutar la suite de pruebas
        run: |
          set -o pipefail
          dotnet run --project MundoVoxel.Pruebas -c Release --nologo 2>&1 | tee suite.log

      - name: Marcar fallos de la suite como anotaciones
        if: failure()
        run: |
          grep -E '\[FALLA\]|PRUEBAS|Error procesando|sospechoso|limitado|Exception' suite.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done || true
          tail -12 suite.log | while IFS= read -r line; do echo "::error::[cola] $line"; done || true

      - name: Subir log de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-suite
          path: suite.log

  cliente-maui:
    name: Cliente MAUI (Windows + Android)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar workload MAUI
        run: dotnet workload install maui

      - name: Compilar cliente Windows
        run: dotnet build MundoVoxel.Client -f net10.0-windows10.0.19041.0

      - name: Compilar cliente Android
        run: dotnet build MundoVoxel.Client -f net10.0-android